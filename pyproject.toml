[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-kernel"
version = "0.4.0"
description = "Local, correctable context for coding agents"
requires-python = ">=3.11"
authors = [{name = "Gaston Gelhorn", email = "gastongelhorn@gmail.com"}]
dependencies = []

[project.scripts]
memory = "context_kernel.cli:main"

[tool.setuptools.packages.find]
include = ["context_kernel*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-kernel"
version = "0.8.0"
description = "Memory for coding agents that you keep up to date by talking"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Gaston Gelhorn", email = "gastongelhorn@gmail.com"}]
dependencies = []

[project.scripts]
memory = "context_kernel.cli:main"
context-kernel = "context_kernel.plugin:main"

[tool.setuptools.packages.find]
include = ["context_kernel*"]

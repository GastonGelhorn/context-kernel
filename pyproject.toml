[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelflife-context"
version = "0.10.1"
description = "Memory for coding agents that you keep up to date by talking"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Gaston Gelhorn", email = "gastongelhorn@gmail.com"}]
dependencies = []

[project.scripts]
memory = "shelflife_context.cli:main"
shelflife-context = "shelflife_context.plugin:main"

[tool.setuptools.packages.find]
include = ["shelflife_context*"]
